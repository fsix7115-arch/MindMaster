<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Grid — MindMaster</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .focus-game {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
    }
    .mm-focus-grid {
      display: grid;
      gap: 6px;
      width: 100%;
      padding: 12px;
      background: var(--bg-glass);
      border: 2px solid var(--border-glass-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-glass);
    }
    .mm-focus-cell {
      aspect-ratio: 1;
      min-height: 50px;
    }
    .mm-focus-cell:focus {
      outline: 2px solid var(--neon-blue);
      outline-offset: 2px;
    }
    @media (max-width: 480px) {
      .mm-focus-cell { min-height: 40px; font-size: 1rem !important; }
    }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#05070a">
</head>
<body>
  <div class="particles" id="particles"></div>

  <div class="focus-game">
    <div class="game-header glass-panel" style="padding: 16px 24px; width: 100%; justify-content: space-between;">
      <h1 class="game-title text-gradient">Focus Grid</h1>
      <div id="soundToggle"></div>
    </div>

    <div class="stats-row glass-panel" style="padding: 14px 24px; width: 100%; justify-content: space-around;">
      <div class="stat-item"><span class="stat-label">Target</span><span class="stat-value purple mm-target-display">1</span></div>
      <div class="stat-item"><span class="stat-label">Time</span><span class="stat-value blue mm-timer-display">0.0s</span></div>
      <div class="stat-item"><span class="stat-label">Errors</span><span class="stat-value amber mm-error-display">0</span></div>
    </div>

    <div class="controls" style="width: 100%; max-width: 500px; justify-content: center;">
      <div class="btn-group" id="difficultyToggle">
        <button class="btn-toggle" data-mode="easy">🌱 EASY (6×6)</button>
        <button class="btn-toggle active" data-mode="medium">⚡ MEDIUM (5×5)</button>
        <button class="btn-toggle" data-mode="hard">🔥 HARD (4×4)</button>
      </div>
      <button class="btn btn-primary" id="startBtn">START</button>
      <button class="btn btn-secondary" id="resetBtn" style="display:none;">🔄 RESET</button>
    </div>

    <div class="mm-focus-grid" id="focusGrid"></div>
  </div>

  <div class="modal-overlay" id="endModal">
    <div class="glass-panel modal-content end-screen">
      <h2 class="text-gradient-green" style="font-size: 2rem;">🎯 COMPLETE!</h2>
      <div class="final-score text-gradient" id="finalScore">0</div>
      <p id="timeText" style="color: var(--text-secondary);"></p>
      <p id="errorText" style="color: var(--text-muted);"></p>
      <div style="display: flex; gap: 12px; justify-content: center; margin-top: 24px;">
        <button class="btn btn-primary" id="playAgainBtn">PLAY AGAIN</button>
        <button class="btn btn-secondary" id="closeModalBtn">CLOSE</button>
      </div>
    </div>
  </div>

  <script>
    const MM = window.MM || {};
    window.MM = MM;
  </script>
  <script src="assets/js/core/storage.js"></script>
  <script src="assets/js/core/mouse-tracker.js"></script>
  <script src="assets/js/core/audio.js"></script>
  <script src="assets/js/core/haptics.js"></script>
  <script src="assets/js/core/notifications.js"></script>
  <script src="assets/js/core/game-engine.js"></script>
  <script src="assets/js/games/shared/components.js"></script>
  <script src="assets/js/games/focus_grid/focus_grid.js"></script>
  <script>
    (async function() {
      'use strict';
      try { if (MM.Storage?.open) await MM.Storage.open(); } catch(e) {}
      try { if (MM.Audio?.init) await MM.Audio.init(); } catch(e) {}

      MM.Mouse.bindEvents();
      MM.Mouse.tick();

      // Particles
      for (let i = 0; i < 20; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = `${Math.random() * 100}%`;
        p.style.top = `${Math.random() * 100}%`;
        p.style.setProperty('--duration', `${6 + Math.random() * 6}s`);
        document.getElementById('particles').appendChild(p);
      }

      // Sound toggle
      const soundToggle = new MM.UI.SoundToggle({ music: false, sfx: true, onChange: ({sfx}) => MM.Audio.setMuted(!sfx) });
      document.getElementById('soundToggle').appendChild(soundToggle.getElement());

      // Difficulty
      document.querySelectorAll('#difficultyToggle .btn-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#difficultyToggle .btn-toggle').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          MM.Engine.setDifficulty(btn.dataset.mode);
          MM.Audio.select();
        });
      });

      // Game controls
      document.getElementById('startBtn').addEventListener('click', async () => {
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('resetBtn').style.display = 'inline-flex';
        document.querySelectorAll('#difficultyToggle .btn-toggle').forEach(b => b.disabled = true);
        await MM.Engine.startSession('focus_grid', MM.Engine.difficulty);
        MM.Audio.select();
      });

      document.getElementById('resetBtn').addEventListener('click', async () => {
        await MM.Games.FocusGrid.reset();
        await MM.Games.FocusGrid.init();
        document.getElementById('startBtn').style.display = 'inline-flex';
        document.getElementById('resetBtn').style.display = 'none';
        document.querySelectorAll('#difficultyToggle .btn-toggle').forEach(b => b.disabled = false);
        document.getElementById('focusGrid').innerHTML = '';
        MM.Audio.click();
      });

      document.getElementById('playAgainBtn').addEventListener('click', () => {
        document.getElementById('endModal').classList.remove('active');
        document.getElementById('resetBtn').click();
        setTimeout(() => document.getElementById('startBtn').click(), 100);
      });
      document.getElementById('closeModalBtn').addEventListener('click', () => {
        document.getElementById('endModal').classList.remove('active');
        document.getElementById('resetBtn').click();
      });

      // End modal
      const origEnd = MM.Games.FocusGrid.end;
      MM.Games.FocusGrid.end = async function() {
        await origEnd.call(this);
        const session = MM.Engine.state.session;
        const time = session?.duration || 0;
        const errors = session?.errors || 0;
        document.getElementById('finalScore').textContent = MM.Engine.formatScore(session?.score || 0);
        document.getElementById('timeText').textContent = `Time: ${time.toFixed(1)}s`;
        document.getElementById('errorText').textContent = errors > 0 ? `${errors} errors (+${errors*2}s penalty)` : 'Perfect! No errors';
        document.getElementById('endModal').classList.add('active');
      };

      MM.Mouse.trackElement(document.querySelector('.focus-game'), { depth: 8, tilt: 4 });
      console.log('✅ Focus Grid ready');
    })();
  </script>

  <!-- MindMaster PWA -->
  <script src="assets/js/core/leaderboard.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
